name: Deploy Azure Resource
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Echo Login
        run: echo "Starting login to Azure..."
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Echo script
        run: |
          echo "Starting Bicep..."
      - name: Install/Upgrade Bicep
        run: |
          az bicep install
          az bicep upgrade
      - name: Build and Deploy Azure Resources
        run: |
          bicep build main.bicep
          az deployment sub create --name create-rg --location southafricanorth --template-file ./main.bicep --parameters resourceGroupName=rg-gaexample location=southafricanorth
      - name: Deployment Successful
        run: |
          echo "Bicep deployment completed successfully"
